spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/projectpulse}
    username: ${SPRING_DATASOURCE_USERNAME:projectpulse}
    password: ${SPRING_DATASOURCE_PASSWORD:projectpulse}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
